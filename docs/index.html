<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
    </header>

    <main>
      <section>
        <h2>Fetch Notes</h2>
        <button id="load-btn">Load Notes from Server</button>
        <p id="status"></p>
        <ul id="notes-list"></ul>
      </section>

      <section>
        <h2>Create a Note</h2>
        <form id="note-form">
          <label for="title-input">Title (Required, max 100 chars)</label>
          <input type="text" id="title-input" maxlength="100" required />
          
          <label for="body-input">Body (Optional)</label>
          <textarea id="body-input" rows="4"></textarea>
          
          <button type="submit" id="submit-btn">Create Note</button>
        </form>
      </section>
    </main>
  </body>
</html>
